<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DTCG Pro - DECK ARCHITECT</title>
    <style>
        :root {
            --blue: #00d2ff; --purple: #a200ff; --gold: #ffcc00; --green: #00ffcc; --red: #ff4757; --bg: #05050a;
            --panel: rgba(20, 20, 30, 0.9); --border: rgba(0, 210, 255, 0.3);
        }

        body { 
            background: var(--bg); background-image: radial-gradient(circle at center, #111 0%, #000 100%);
            color: white; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden;
        }
        .language-switcher { position: fixed; top: 12px; right: 14px; z-index: 14000; }
        .lang-switcher-label { display: flex; align-items: center; gap: 8px; color: #888; font-size: 11px; font-family: monospace; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .lang-select { background: rgba(0,0,0,0.72); border: 1px solid rgba(0,210,255,0.45); color: var(--blue); border-radius: 4px; padding: 6px 8px; outline: none; font-family: monospace; font-weight: 800; cursor: pointer; }

        /* 🟢 左侧卡库：独立滚动 */
        #card-library { width: 70%; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        
        .lib-header { padding: 20px; flex-shrink: 0; }
        
        /* 🔥 高级过滤器：吸顶且内容丰富 */
        .filter-wrapper {
            position: sticky; top: 0; background: var(--bg); padding: 10px 20px;
            z-index: 100; border-bottom: 1px solid #222;
        }
        
        .filter-bar { 
            background: var(--panel); padding: 12px; border-radius: 8px; border: 1px solid var(--border);
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }

        .filter-bar input, .filter-bar select {
            background: rgba(0,0,0,0.6); border: 1px solid #444; color: white;
            padding: 8px; outline: none; border-radius: 4px; font-size: 13px;
        }
        .filter-bar input { flex: 2; min-width: 150px; }
        .filter-bar select { flex: 1; cursor: pointer; }

        .card-grid-container { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 20px; }

        .card-item { cursor: pointer; transition: all 0.2s; position: relative; }
        .card-item:hover { transform: translateY(-8px); }
        .card-item img { width: 100%; border-radius: 8px; border: 1px solid transparent; }
        .card-item:hover img { border-color: var(--blue); box-shadow: 0 0 15px var(--blue); }

        /* 🟣 右侧面板 */
        #my-deck { width: 30%; padding: 25px; background: var(--panel); display: flex; flex-direction: column; border-left: 1px solid var(--border); }
        .deck-title { color: var(--blue); font-size: 20px; font-weight: 900; letter-spacing: 2px; margin-bottom: 15px; }
        
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: 900; font-size: 12px; text-transform: uppercase; transition: 0.3s; }
        .btn-deploy { background: var(--blue); color: #000; grid-column: span 2; font-size: 14px; margin-bottom: 5px; }
        .btn-export { background: transparent; border: 1px solid var(--purple); color: var(--purple); }
        .btn-import { background: transparent; border: 1px solid #555; color: #888; }
        .btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px currentColor; }

        #deckList { flex-grow: 1; overflow-y: auto; }
        .deck-card {
            display: flex; align-items: center; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px; border-radius: 4px; overflow: hidden;
        }
        .deck-card img { width: 45px; height: 62px; object-fit: cover; }
        .deck-card-info { flex-grow: 1; padding: 0 10px; font-size: 12px; }
        .remove-btn { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: none; height: 62px; padding: 0 12px; cursor: pointer; }

        .back-btn { background: transparent; border: 1px solid #333; color: #666; padding: 8px 15px; cursor: pointer; margin-bottom: 10px; }
        .back-btn:hover { border-color: var(--blue); color: var(--blue); }


        /* Round 11K: builder search/UX upgrades */
        .filter-chip-row { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; margin-top: 8px; }
        .color-chip { background: rgba(255,255,255,0.04); border: 1px solid #333; color: #aaa; padding: 6px 9px; border-radius: 999px; cursor: pointer; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
        .color-chip.active { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 10px rgba(0,210,255,0.25); }
        .utility-btn { background: rgba(255,255,255,0.05); border: 1px solid #444; color: #aaa; padding: 8px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 900; }
        .utility-btn:hover { color: var(--blue); border-color: var(--blue); }
        #result-meta, #deck-error { font-family: monospace; font-size: 11px; color: #888; margin-top: 8px; }
        #deck-error.invalid { color: var(--red); }
        #deck-error.valid { color: var(--green); }
        /* Round 18L: deck builder cockpit polish. Keep deck-building UI readable
           without changing exported deck payloads or official validation rules. */
        #deck-readiness-panel { margin-top: 10px; display: grid; gap: 6px; }
        .readiness-row { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; background: rgba(255,255,255,0.035); font-size: 10px; font-family: monospace; }
        .readiness-row.ok { border-color: rgba(0,255,204,0.28); color: #bfffee; }
        .readiness-row.warn { border-color: rgba(255,204,0,0.35); color: #ffe7a1; }
        .readiness-row.bad { border-color: rgba(255,71,87,0.35); color: #ffc7cd; }
        .readiness-pill { border-radius: 999px; padding: 2px 6px; background: rgba(0,0,0,0.35); font-weight: 900; }
        .deck-section-title { margin: 12px 0 7px; padding: 6px 8px; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; color: #aaa; font-size: 10px; font-family: monospace; font-weight: 900; letter-spacing: 1px; background: rgba(0,0,0,0.25); }
        .deck-card.grouped { min-height: 76px; }
        .deck-copy-badge { min-width: 34px; text-align: center; font-family: monospace; font-weight: 900; color: var(--gold); }
        .deck-copy-badge.over { color: var(--red); }
        .quick-count-btns { display: flex; gap: 5px; margin-top: 5px; }
        .quick-count-btns .mini-btn { flex: 1; padding: 5px 4px; }
        .builder-toast { position: fixed; right: 24px; bottom: 24px; z-index: 13000; padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(0,210,255,0.45); background: rgba(5,5,10,0.94); color: var(--blue); font-family: monospace; font-size: 11px; font-weight: 900; box-shadow: 0 0 22px rgba(0,210,255,0.22); animation: builderToast .16s ease-out; }
        @keyframes builderToast { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .deck-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
        .mini-btn { background: rgba(255,255,255,0.05); color: #aaa; border: 1px solid #333; border-radius: 4px; padding: 6px; cursor: pointer; font-size: 10px; font-weight: 900; }
        .mini-btn:hover { color: var(--blue); border-color: var(--blue); }
        .card-badge { position:absolute; left:6px; bottom:7px; right:6px; background:rgba(0,0,0,0.75); border:1px solid rgba(255,255,255,0.12); border-radius:5px; padding:5px; font-size:10px; line-height:1.25; pointer-events:none; }
        .card-badge-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:800; }
        .card-badge-meta { color:#aaa; font-family:monospace; }
        #curve-stats { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 10px; }
        .curve-cell { background: rgba(255,255,255,0.04); border: 1px solid #222; border-radius: 4px; padding: 5px 2px; text-align: center; font-family: monospace; font-size: 10px; color: #aaa; }
        .curve-cell b { display:block; color:white; font-size:12px; }
        #hover-card-info { position: fixed; left: 20px; bottom: 20px; width: 310px; max-height: 48vh; overflow-y: auto; display: none; flex-direction: column; gap: 8px; background: rgba(5,5,10,0.96); border: 1px solid var(--blue); border-radius: 10px; padding: 14px; z-index: 12000; box-shadow: 0 0 24px rgba(0,210,255,0.25); font-size: 12px; }
        #info-name { color: var(--blue); font-weight: 900; font-size: 16px; }
        #info-type-level, #info-dp { color: #aaa; font-family: monospace; }
        #info-main-effect, #info-source-effect { color: #ddd; line-height: 1.45; }

        /* Builder workspace v2: tighter tools, larger deck list, less chrome. */
        body {
            display: grid;
            grid-template-columns: minmax(0, 1fr) clamp(430px, 30vw, 560px);
        }
        #card-library {
            width: auto;
            min-width: 0;
            border-right: 1px solid rgba(0,210,255,0.24);
        }
        .lib-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 24px 8px;
            min-height: 58px;
            box-sizing: border-box;
        }
        .back-btn { margin: 0; height: 36px; }
        .filter-wrapper {
            padding: 8px 24px 10px;
            background: linear-gradient(180deg, rgba(5,5,10,0.98), rgba(5,5,10,0.92));
        }
        .filter-bar {
            display: grid;
            grid-template-columns: minmax(220px, 1.35fr) minmax(180px, 1fr) minmax(150px, .8fr) minmax(105px, .52fr) minmax(112px, .56fr) minmax(132px, .62fr) auto;
            gap: 8px;
            padding: 10px;
            align-items: center;
            border-radius: 6px;
            background: rgba(14,14,22,0.88);
        }
        .filter-bar input,
        .filter-bar select {
            min-width: 0;
            width: 100%;
            box-sizing: border-box;
            height: 38px;
            font-size: 12px;
        }
        .filter-bar input { flex: initial; }
        .filter-bar select { flex: initial; }
        .utility-btn { height: 38px; min-width: 72px; }
        .filter-chip-row {
            grid-column: 1 / -2;
            flex-wrap: nowrap;
            overflow-x: auto;
            margin-top: 0;
            padding-top: 2px;
            scrollbar-width: thin;
        }
        .color-chip {
            flex: 0 0 auto;
            padding: 5px 10px;
            font-size: 10px;
        }
        #result-meta {
            grid-column: -2 / -1;
            justify-self: end;
            align-self: center;
            margin-top: 0;
            white-space: nowrap;
        }
        .card-grid-container { padding: 18px 24px; }
        .card-grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 18px; }

        #my-deck {
            width: auto;
            min-width: 0;
            height: 100vh;
            box-sizing: border-box;
            padding: 18px 20px 18px;
            gap: 10px;
            background: rgba(16,16,26,0.94);
        }
        .deck-title {
            margin-bottom: 2px;
            padding-right: 120px;
            font-size: 18px;
            line-height: 1.1;
            letter-spacing: 1px;
        }
        .deck-stats {
            flex: 0 0 auto;
            padding: 10px !important;
            margin-bottom: 0 !important;
            border-radius: 6px !important;
        }
        #curve-stats {
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 3px;
            margin-top: 8px;
        }
        .curve-cell { padding: 4px 2px; font-size: 9px; }
        .curve-cell b { font-size: 11px; }
        #deck-error {
            margin-top: 7px;
            line-height: 1.3;
            max-height: 32px;
            overflow: hidden;
        }
        #deck-readiness-panel {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 5px;
            margin-top: 8px;
        }
        .readiness-row {
            grid-template-columns: 14px 1fr auto;
            padding: 5px 7px;
            gap: 5px;
            min-width: 0;
        }
        .readiness-row span:nth-child(2) {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .readiness-pill { padding: 1px 5px; }
        .action-btns {
            flex: 0 0 auto;
            gap: 8px;
            margin-bottom: 0;
        }
        .btn {
            min-height: 42px;
            padding: 9px 10px;
            border-radius: 5px;
        }
        .btn-deploy { margin-bottom: 0; }
        #vault-btn { margin-top: 0 !important; }
        #deckList {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding-right: 4px;
        }
        .deck-section-title {
            position: sticky;
            top: 0;
            z-index: 2;
            margin: 8px 0 6px;
            padding: 6px 8px;
            background: rgba(7,7,12,0.96);
            border-color: rgba(0,210,255,0.18);
        }
        .deck-card.grouped,
        .deck-card {
            min-height: 58px;
            margin-bottom: 6px;
            border-radius: 6px;
        }
        .deck-card img { width: 40px; height: 56px; }
        .deck-card-info { padding: 0 8px; min-width: 0; }
        .quick-count-btns { gap: 4px; margin-top: 4px; }
        .quick-count-btns .mini-btn { padding: 3px 4px; font-size: 9px; }
        .deck-copy-badge { min-width: 30px; font-size: 13px; }
        .remove-btn { height: 58px; padding: 0 10px; }

        @media (max-width: 1200px) {
            body { grid-template-columns: minmax(0, 1fr) 400px; }
            .filter-bar { grid-template-columns: minmax(180px, 1fr) minmax(160px, 1fr) repeat(3, minmax(95px, .6fr)) auto; }
            #sortFilter { grid-column: span 2; }
            .filter-chip-row { grid-column: 1 / -1; }
            #result-meta { grid-column: 1 / -1; justify-self: start; }
        }

        /* Builder workspace v3: wider deck column and click-to-inspect flow. */
        body {
            grid-template-columns: minmax(0, 1fr) clamp(560px, 34vw, 680px);
        }
        #my-deck { padding: 16px 24px 18px; }
        .deck-title { font-size: 22px; margin-bottom: 6px; }
        .deck-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 12px;
            row-gap: 7px;
        }
        .deck-stats > div:nth-child(1),
        .deck-stats > div:nth-child(2),
        .deck-stats > div:nth-child(3),
        .deck-stats > #curve-stats,
        .deck-stats > #deck-error,
        .deck-stats > #deck-readiness-panel {
            grid-column: 1 / -1;
        }
        #curve-stats { margin-top: 2px; }
        #deck-readiness-panel {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            margin-top: 2px;
        }
        .readiness-row {
            padding: 4px 7px;
            font-size: 9px;
            border-radius: 5px;
        }
        .readiness-row[data-check="noSideDeck"],
        .readiness-row[data-check="deploy"] {
            display: none;
        }
        .action-btns {
            grid-template-columns: 1.25fr .75fr .75fr;
            gap: 8px;
        }
        .btn-deploy {
            grid-column: auto;
            font-size: 13px;
        }
        #vault-btn {
            grid-column: 1 / -1 !important;
            min-height: 38px;
        }
        .deck-card.grouped,
        .deck-card {
            min-height: 88px;
            align-items: stretch;
        }
        .deck-card img {
            width: 64px;
            height: 88px;
            flex: 0 0 auto;
        }
        .deck-card-info {
            display: flex;
            min-width: 0;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
        }
        .deck-copy-badge {
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }
        .remove-btn { height: auto; min-width: 42px; font-size: 16px; }
        .quick-count-btns .mini-btn {
            min-height: 28px;
            font-size: 10px;
        }
        .card-item { border-radius: 8px; }
        .library-add-btn {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 30px;
            height: 30px;
            border-radius: 999px;
            border: 1px solid rgba(0,255,204,0.55);
            background: rgba(0,20,18,0.88);
            color: var(--green);
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            z-index: 2;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity .15s, transform .15s, filter .15s;
        }
        .card-item:hover .library-add-btn {
            opacity: 1;
            transform: translateY(0);
        }
        .library-add-btn:hover { filter: brightness(1.3); box-shadow: 0 0 14px rgba(0,255,204,0.32); }
        #builder-detail-overlay {
            position: fixed;
            inset: 0;
            z-index: 15000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.78);
            backdrop-filter: blur(8px);
            padding: 28px;
            box-sizing: border-box;
        }
        #builder-detail-panel {
            width: min(920px, 94vw);
            max-height: min(760px, 92vh);
            display: grid;
            grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
            gap: 20px;
            border: 1px solid rgba(0,210,255,0.42);
            border-radius: 8px;
            background: rgba(12,12,20,0.98);
            box-shadow: 0 0 34px rgba(0,210,255,0.22);
            padding: 18px;
            box-sizing: border-box;
        }
        #builder-detail-art {
            width: 100%;
            aspect-ratio: 5 / 7;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.16);
            background-size: cover;
            background-position: center;
            background-color: rgba(255,255,255,0.04);
        }
        .builder-detail-content {
            min-width: 0;
            overflow-y: auto;
            padding-right: 4px;
        }
        .builder-detail-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 12px;
        }
        #builder-detail-name {
            color: var(--blue);
            font-size: 24px;
            font-weight: 950;
            line-height: 1.15;
        }
        #builder-detail-meta,
        #builder-detail-traits {
            color: #aaa;
            font-family: monospace;
            font-size: 12px;
            margin-top: 6px;
            line-height: 1.45;
        }
        .builder-detail-close {
            flex: 0 0 auto;
            border: 1px solid rgba(255,71,87,0.55);
            color: var(--red);
            background: rgba(255,71,87,0.08);
            border-radius: 999px;
            width: 34px;
            height: 34px;
            cursor: pointer;
            font-weight: 900;
        }
        .builder-detail-actions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin: 12px 0 14px;
        }
        .builder-detail-actions button {
            min-height: 38px;
            border-radius: 5px;
            border: 1px solid rgba(0,210,255,0.38);
            background: rgba(0,210,255,0.08);
            color: var(--blue);
            cursor: pointer;
            font-weight: 900;
        }
        .builder-detail-block {
            margin-top: 10px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 6px;
            background: rgba(255,255,255,0.045);
            line-height: 1.55;
            color: #e5e5e5;
            font-size: 13px;
        }
        .builder-detail-label {
            display: block;
            margin-bottom: 6px;
            color: var(--gold);
            font-family: monospace;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        @media (max-width: 1500px) {
            body { grid-template-columns: minmax(0, 1fr) 520px; }
            #deck-readiness-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .deck-card img { width: 58px; height: 81px; }
            .deck-card.grouped, .deck-card { min-height: 81px; }
        }
        @media (max-width: 980px) {
            body { grid-template-columns: 1fr; overflow: auto; }
            #card-library, #my-deck { min-height: 70vh; height: auto; }
            #builder-detail-panel { grid-template-columns: 1fr; overflow-y: auto; }
            #builder-detail-art { max-width: 260px; margin: 0 auto; }
        }
        @media (max-width: 1250px) and (min-width: 981px) {
            body { grid-template-columns: minmax(0, 1fr) 460px; }
            .filter-bar {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            #sortFilter,
            .utility-btn,
            .filter-chip-row,
            #result-meta {
                grid-column: auto;
            }
            .filter-chip-row {
                grid-column: 1 / -1;
            }
            #result-meta {
                justify-self: start;
            }
            #my-deck { padding-left: 18px; padding-right: 18px; }
            .deck-card img { width: 56px; height: 78px; }
            .deck-card.grouped, .deck-card { min-height: 78px; }
        }

        /* Builder v3.1: keep the library scrollable and prevent filter controls
           from escaping the left workspace in Chinese/localized labels. */
        body {
            height: 100vh;
            overflow: hidden;
        }
        #card-library,
        #my-deck {
            height: 100vh;
            min-height: 0;
            overflow: hidden;
        }
        #card-library {
            display: flex;
            flex-direction: column;
        }
        .lib-header,
        .filter-wrapper {
            flex: 0 0 auto;
        }
        .card-grid-container {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-gutter: stable;
        }
        .filter-bar {
            grid-template-columns: minmax(210px, 1.2fr) minmax(170px, 1fr) minmax(140px, .8fr) minmax(108px, .58fr) minmax(118px, .62fr) minmax(132px, .68fr);
            overflow: hidden;
        }
        .utility-btn {
            grid-column: 1 / 2;
            width: 100%;
            min-width: 0;
        }
        .filter-chip-row {
            grid-column: 2 / -2;
            min-width: 0;
        }
        #result-meta {
            grid-column: -2 / -1;
            min-width: 0;
        }
        @media (max-width: 1500px) {
            .filter-bar {

        }

</head>

    <script src="/i18n.js"></script>
    <script>
        function t(key, vars) {
            return window.DTCGI18N?.t(key, vars) || key;
        }

        function displayCardName(card) {
            return window.DTCGI18N?.cardName(card) || card?.name || card?.id || 'UNKNOWN';
        }

        function displayMainText(card) {
            return window.DTCGI18N?.cardMain(card) || card?.mainEffect || '';
        }

        function displaySourceText(card) {
            return window.DTCGI18N?.cardSource(card) || card?.sourceEffect || '';
        }

        function displayEffectText(card) {
            return window.DTCGI18N?.cardEffect(card) || card?.effectText || '';
        }

        function displayCardImage(card) {
            return window.DTCGI18N?.cardImage(card) || card?.img || 'cardback.png';
        }

        function displayType(card) {
            const raw = String(card?.type || '').toLowerCase();
            if (raw.includes('egg')) return t('TYPE_EGG');
            if (raw.includes('dual')) return t('TYPE_DUAL');
            if (raw.includes('digimon')) return t('TYPE_DIGIMON');
            if (raw.includes('tamer')) return t('TYPE_TAMER');
            if (raw.includes('option')) return t('TYPE_OPTION');
            return t('TYPE_CARD');
        }

        window.addEventListener('dtcg:language-changed', () => {
            window.DTCGI18N?.apply(document);
            const vaultBtn = document.getElementById('vault-btn');
            if (vaultBtn) vaultBtn.textContent = t('ACCESS_VAULT');
            filterCards();
            renderDeck();
        });
        document.addEventListener('DOMContentLoaded', () => {
            const vaultBtn = document.getElementById('vault-btn');
            if (vaultBtn) vaultBtn.textContent = t('ACCESS_VAULT');
        });

        let allCards = [];
        let myDeck = normalizeImportedDeck(safeJsonParse(localStorage.getItem('currentDeck'), []));
        let currentUserId = null;
        let builderDetailCard = null;
        let loadedDeckName = "MY_NEW_DECK"; // 用来记住你现在编辑的卡组叫啥

        // 🔥 分页引擎核心变量
        let currentFilteredCards = [];
        let currentRenderedIndex = 0;
        const CHUNK_SIZE = 50; // 每次装填 50 张卡
        const selectedColors = new Set();


        // Round 11J: deck payload helpers. Keep builder, lobby, and server using the
        // same practical rules: 50-card main deck, up to 5 Digi-Eggs, max 4 copies.
        function safeJsonParse(value, fallback) {
            try { return value ? JSON.parse(value) : fallback; }
            catch (e) { console.warn('Deck JSON parse failed:', e.message); return fallback; }
        }

        function isDigiEgg(card) {
            const type = String(card?.type || '').toLowerCase();
            return Number(card?.level) === 2 || type.includes('egg') || type.includes('digi-egg');
        }

        function cloneDeckCard(card) {
            if (!card || !card.id) return null;
            return { ...card, instanceId: `${card.id}-${Math.random().toString(36).slice(2, 10)}-${Date.now()}` };
        }

        function hydrateCardById(id) {
            const key = String(id || '').trim();
            const card = allCards.find(c => c.id === key);
            return card ? cloneDeckCard(card) : null;
        }

        function normalizeImportedDeck(input) {
            let raw = [];
            if (Array.isArray(input)) raw = input;
            else if (input && typeof input === 'object') {
                if (Array.isArray(input.cards)) raw = input.cards;
                else raw = [...(input.main || []), ...(input.eggs || input.eggDeck || [])];
            }
            return raw.map(item => {
                if (typeof item === 'string') return hydrateCardById(item) || { id: item.trim(), name: item.trim(), type: 'unknown', level: null, img: '' };
                if (item && item.id) return hydrateCardById(item.id) || cloneDeckCard(item);
                return null;
            }).filter(Boolean);
        }

        function splitDeck(deck = myDeck) {
            const eggs = deck.filter(isDigiEgg);
            const main = deck.filter(c => !isDigiEgg(c));
            return { main, eggs };
        }

        function getDeckCopyCounts(deck = myDeck) {
            return deck.reduce((map, card) => {
                map[card.id] = (map[card.id] || 0) + 1;
                return map;
            }, {});
        }



        // Round 22BN: official tournament deck legality guard (Banned / Restricted Card Announcement, Mar. 16, 2026).
        // Builder-side validation mirrors server ready checks so illegal decks are caught before deploy/export.
        const OFFICIAL_BANNED_CARD_IDS = new Set([
            'BT5-109', 'BT2-090', 'EX5-065'
        ]);
        const OFFICIAL_RESTRICTED_CARD_LIMITS = {
            'BT23-032': 1, 'BT3-092': 1, 'BT10-080': 1, 'EX5-059': 1, 'EX5-061': 1,
            'BT1-090': 1, 'BT6-104': 1, 'BT13-110': 1, 'BT16-011': 1, 'EX3-057': 1,
            'EX4-006': 1, 'EX1-021': 1, 'BT19-040': 1, 'EX2-070': 1, 'BT4-111': 1,
            'BT17-069': 1, 'BT4-104': 1, 'P-029': 1, 'P-030': 1, 'BT11-033': 1,
            'ST9-09': 1, 'EX4-030': 1, 'P-123': 1, 'P-130': 1, 'BT15-057': 1,
            'BT9-098': 1, 'ST2-13': 1, 'BT14-084': 1, 'BT14-002': 1, 'BT15-102': 1,
            'EX5-015': 1, 'EX5-018': 1, 'EX5-062': 1, 'BT13-012': 1, 'BT2-069': 1,
            'BT7-069': 1, 'BT3-054': 1, 'EX2-039': 1, 'P-008': 1, 'P-025': 1,
            'BT11-064': 1, 'BT7-107': 1, 'BT10-009': 1, 'BT7-038': 1, 'BT7-064': 1,
            'BT2-047': 1, 'BT3-103': 1, 'BT6-100': 1, 'EX1-068': 1, 'BT7-072': 1
        };
        const OFFICIAL_BANNED_PAIRS = [
            { a: 'EX2-007', b: ['EX7-064'] },
            { a: 'BT20-037', b: ['BT17-035', 'EX8-037'] }
        ];

        function normalizeDeckCardNumber(value) {
            if (value && typeof value === 'object') value = value.id;
            return String(value || '').trim().toUpperCase();
        }

        // Round 22DH/22DJ: Token 卡不能放入官方卡组；它们只用于卡池检索/运行时生成。
        function isTokenDeckCard(card) {
            const id = normalizeDeckCardNumber(card);
            const kind = String(card?.cardKind || '').toLowerCase();
            return card?.isToken === true || kind === 'token' || id === 'TOKEN' || /(^|-)TOKEN(?:\d+)?$/.test(id);
        }

        function validateOfficialDeckLegality(deck = myDeck) {
            const tokenCards = deck.filter(isTokenDeckCard).map(card => normalizeDeckCardNumber(card));
            if (tokenCards.length) return { ok: false, error: `Token 卡不能放入官方卡组：${[...new Set(tokenCards)].join(', ')}` };
            const counts = deck.reduce((map, card) => {
                const id = normalizeDeckCardNumber(card);
                if (id) map[id] = (map[id] || 0) + 1;
                return map;
            }, {});
            for (const id of OFFICIAL_BANNED_CARD_IDS) {
                if ((counts[id] || 0) > 0) return { ok: false, error: `${id} 为官方禁卡，不能放入赛事卡组。` };
            }
            for (const [id, limit] of Object.entries(OFFICIAL_RESTRICTED_CARD_LIMITS)) {
                const count = counts[id] || 0;
                if (count > limit) return { ok: false, error: `${id} 为官方限制卡，只能放 ${limit} 张；当前 ${count} 张。` };
            }
            for (const pair of OFFICIAL_BANNED_PAIRS) {
                if ((counts[pair.a] || 0) <= 0) continue;
                const hit = pair.b.find(id => (counts[id] || 0) > 0);
                if (hit) return { ok: false, error: `官方 banned pair：${pair.a} 不能与 ${hit} 同时放入卡组。` };
            }
            return { ok: true };
        }

        function validateDeck(deck = myDeck, requireFullMain = false) {
            const { main, eggs } = splitDeck(deck);
            const counts = getDeckCopyCounts(deck);
            const tooMany = Object.entries(counts).find(([, count]) => count > 4);
            if (tooMany) return { ok: false, error: `同编号卡牌最多 4 张：${tooMany[0]} 当前 ${tooMany[1]} 张` };
            const officialLegality = validateOfficialDeckLegality(deck);
            if (!officialLegality.ok) return officialLegality;
            if (eggs.length > 5) return { ok: false, error: `蛋组最多 5 张，当前 ${eggs.length} 张` };
            if (main.length > 50) return { ok: false, error: `主卡组最多 50 张，当前 ${main.length} 张` };
            if (requireFullMain && main.length !== 50) return { ok: false, error: `主卡组必须满 50 张，当前 ${main.length} 张` };
            return { ok: true, mainCount: main.length, eggCount: eggs.length, total: deck.length };
        }


        // Round 18L: official-deck readiness helpers. These only summarize the
        // already-enforced deck rules; they do not change card data or exports.
        function getDeckReadinessChecklist(deck = myDeck) {
            const { main, eggs } = splitDeck(deck);
            const counts = getDeckCopyCounts(deck);
            const copyLeaks = Object.entries(counts).filter(([, count]) => count > 4);
            const officialLegality = validateOfficialDeckLegality(deck);
            const battleReady = main.length === 50 && eggs.length <= 5 && copyLeaks.length === 0 && officialLegality.ok;
            return [
                { key: 'main50', label: 'MAIN DECK', value: `${main.length}/50`, state: main.length === 50 ? 'ok' : (main.length > 50 ? 'bad' : 'warn') },
                { key: 'egg5', label: 'DIGI-EGG DECK', value: `${eggs.length}/5`, state: eggs.length <= 5 ? (eggs.length > 0 ? 'ok' : 'warn') : 'bad' },
                { key: 'copy4', label: 'COPY LIMIT', value: copyLeaks.length ? `${copyLeaks.length} OVER` : '≤4', state: copyLeaks.length ? 'bad' : 'ok' },
                { key: 'officialBR', label: 'BANNED / RESTRICTED', value: officialLegality.ok ? 'OK' : 'ILLEGAL', state: officialLegality.ok ? 'ok' : 'bad' },
                // Round 18O: Bandai Organized Play Tournament Rules Manual says no side decks are permitted.
                // The builder exports only main + Digi-Egg IDs and keeps no side-deck UI.
                { key: 'noSideDeck', label: 'NO SIDE DECK', value: 'OFFICIAL', state: 'ok' },
                { key: 'deploy', label: 'BATTLE READY', value: battleReady ? 'YES' : 'NO', state: battleReady ? 'ok' : 'warn' }
            ];
        }

        function renderDeckReadiness(deck = myDeck) {
            const panel = document.getElementById('deck-readiness-panel');
            if (!panel) return;
            panel.innerHTML = getDeckReadinessChecklist(deck).map(row => `
                <div class="readiness-row ${escapeHtml(row.state)}" data-check="${escapeHtml(row.key)}">
                    <span>${row.state === 'ok' ? '✓' : row.state === 'bad' ? '!' : '•'}</span>
                    <span>${escapeHtml(row.label)}</span>
                    <span class="readiness-pill">${escapeHtml(row.value)}</span>
                </div>
            `).join('');
        }

        function deckCardSortKey(card) {
            const type = String(card?.type || '').toLowerCase();
            if (isDigiEgg(card)) return `0-${card.id}`;
            if (type.includes('digimon')) return `1-${String(card.level ?? 99).padStart(2, '0')}-${card.id}`;
            if (type.includes('tamer')) return `2-${card.id}`;
            if (type.includes('option') || type.includes('dual')) return `3-${card.id}`;
            return `9-${card.id}`;
        }

        function getDeckGroups(deck = myDeck) {
            const groups = new Map();
            for (const card of deck) {
                if (!card?.id) continue;
                if (!groups.has(card.id)) groups.set(card.id, { card, count: 0, indexes: [] });
                const group = groups.get(card.id);
                group.count += 1;
                group.indexes.push(deck.indexOf(card));
            }
            return [...groups.values()].sort((a, b) => deckCardSortKey(a.card).localeCompare(deckCardSortKey(b.card), undefined, { numeric: true }));
        }

        let builderToastTimer = null;
        function showBuilderToast(message) {
            let toast = document.getElementById('builder-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'builder-toast';
                toast.className = 'builder-toast';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            clearTimeout(builderToastTimer);
            builderToastTimer = setTimeout(() => { if (toast) toast.remove(); }, 1500);
        }

        function persistCurrentDeck() {
            const normalized = normalizeImportedDeck(myDeck);
            myDeck = normalized;
            localStorage.setItem('currentDeck', JSON.stringify(myDeck));
            return myDeck;
        }


        // Round 11K: search quality helpers.
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[ch]));
        }

        function normalizeText(value) {
            return String(value || '').toLowerCase().replace(/[\u00a0\u200b]/g, ' ').trim();
        }

        function getCardColors(card) {
            // Round 18T: DUAL cards have Digimon-side colors and lower Option-side
            // colors. Builder filtering should expose both, while runtime Option use
            // still checks only the Option-side colors in game-state.js.
            const raw = [];
            if (Array.isArray(card?.colors) && card.colors.length) raw.push(...card.colors);
            else raw.push(...String(card?.color || '').split(/[\/|,]/));
            if (Array.isArray(card?.optionColors)) raw.push(...card.optionColors);
            if (Array.isArray(card?.dualOptionColors)) raw.push(...card.dualOptionColors);
            return [...new Set(raw.map(x => String(x || '').trim()).filter(Boolean))];
        }

        function cardSearchBlob(card) {
            if (card.searchText) return normalizeText([card.searchText, window.DTCGI18N?.cardSearchText?.(card)].filter(Boolean).join(' '));
            return normalizeText([
                card.id, card.name, displayCardName(card), window.DTCGI18N?.cardSearchText?.(card), card.type, card.color, card.optionName,
                ...(card.colors || []), ...(card.optionColors || []), ...(card.dualOptionColors || []),
                ...(card.traitTokens || []), ...(card.optionTraitTokens || []), ...(card.dualOptionTraitTokens || []),
                ...(card.dualUseReqTraits || []), ...(card.dualUseReqTextContains || []),
                card.traits, card.mainEffect, card.sourceEffect, card.effectText,
                displayMainText(card), displaySourceText(card), displayEffectText(card)
            ].flat().join(' '));
        }

        function matchesTextQuery(card, query) {
            const terms = normalizeText(query).split(/\s+/).filter(Boolean);
            if (terms.length === 0) return true;
            const blob = cardSearchBlob(card);
            return terms.every(term => blob.includes(term));
        }

        function extractPrintedKeywords(card) {
            const text = [card.mainEffect, card.sourceEffect, card.effectText].filter(Boolean).join(' ');
            const out = [];
            const regex = /[＜<]([^＞>]+)[＞>]/g;
            let match;
            while ((match = regex.exec(text)) !== null) {
                const raw = String(match[1] || '').replace(/\([^)]*\)/g, '').trim();
                const keyword = raw.split(/[(:]/)[0].trim();
                if (keyword) out.push(keyword);
            }
            return [...new Set(out)];
        }

        function cardTraitKeywordBlob(card) {
            return normalizeText([
                ...(card.traitTokens || []),
                ...(card.optionTraitTokens || []),
                ...(card.dualOptionTraitTokens || []),
                ...(card.dualUseReqTraits || []),
                ...(card.dualUseReqTextContains || []),
                card.traits || '',
                ...(card.effectBracketTokens || []),
                ...extractPrintedKeywords(card)
            ].flat().join(' '));
        }

        function matchesTraitKeywordQuery(card, query) {
            const terms = normalizeText(query).split(/\s+/).filter(Boolean);
            if (terms.length === 0) return true;
            const blob = cardTraitKeywordBlob(card);
            return terms.every(term => blob.includes(term));
        }

        function matchesColor(card) {
            if (selectedColors.size === 0) return true;
            const colors = getCardColors(card);
            const mode = document.getElementById('colorMode')?.value || 'any';
            const selected = [...selectedColors];
            if (mode === 'all') return selected.every(c => colors.includes(c));
            if (mode === 'exact') return colors.length === selected.length && selected.every(c => colors.includes(c));
            return selected.some(c => colors.includes(c));
        }

        function compareCards(a, b) {
            const mode = document.getElementById('sortFilter')?.value || 'id';
            if (mode === 'name') return String(displayCardName(a) || '').localeCompare(String(displayCardName(b) || '')) || String(a.id || '').localeCompare(String(b.id || ''));
            if (mode === 'level') return (Number(a.level || 99) - Number(b.level || 99)) || String(a.id || '').localeCompare(String(b.id || ''));
            if (mode === 'cost') return (Number(a.playCost ?? 99) - Number(b.playCost ?? 99)) || String(a.id || '').localeCompare(String(b.id || ''));
            if (mode === 'dp') return (Number(a.dp || 0) - Number(b.dp || 0)) || String(a.id || '').localeCompare(String(b.id || ''));
            return String(a.id || '').localeCompare(String(b.id || ''), undefined, { numeric: true });
        }

        function toggleColorFilter(color) {
            if (selectedColors.has(color)) selectedColors.delete(color);
            else selectedColors.add(color);
            document.querySelectorAll('.color-chip').forEach(btn => btn.classList.toggle('active', selectedColors.has(btn.dataset.color)));
            filterCards();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('traitInput').value = '';
            document.getElementById('levelFilter').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('sortFilter').value = 'id';
            document.getElementById('colorMode').value = 'any';
            selectedColors.clear();
            document.querySelectorAll('.color-chip').forEach(btn => btn.classList.remove('active'));
            filterCards();
        }

        function countCopies(cardId) {
            return myDeck.filter(c => c.id === cardId).length;
        }

        function addToFour(cardId) {
            const card = allCards.find(c => c.id === cardId);
            if (!card) return;
            let added = 0;
            while (countCopies(cardId) < 4) {
                const { main, eggs } = splitDeck(myDeck);
                const isEgg = isDigiEgg(card);
                if (isEgg && eggs.length >= 5) break;
                if (!isEgg && main.length >= 50) break;
                myDeck.push(cloneDeckCard(card));
                added++;
            }
            if (added === 0) return alert('⚠️ 无法补齐：已达同编号 4 张或对应卡组容量已满。');
            persistCurrentDeck();
            renderDeck();
        }

        function removeAllCopies(cardId) {
            const before = myDeck.length;
            myDeck = myDeck.filter(c => c.id !== cardId);
            if (myDeck.length === before) return;
            persistCurrentDeck();
            renderDeck();
        }

        function renderCurve(main) {
            const holder = document.getElementById('curve-stats');
            if (!holder) return;
            const buckets = { 'Lv2': 0, 'Lv3': 0, 'Lv4': 0, 'Lv5': 0, 'Lv6': 0, 'Lv7': 0, 'TM': 0, 'OP': 0 };
            for (const card of main) {
                const t = String(card.type || '').toLowerCase();
                if (t.includes('tamer')) buckets.TM++;
                else if (t.includes('option')) buckets.OP++;
                else if (Number(card.level) >= 2 && Number(card.level) <= 7) buckets[`Lv${Number(card.level)}`]++;
            }
            holder.innerHTML = Object.entries(buckets).map(([label, count]) => `<div class="curve-cell"><span>${label}</span><b>${count}</b></div>`).join('');
        }

        function importErrorReport(rawItems, imported) {
            const knownIds = new Set(allCards.map(c => c.id));
            const missing = rawItems
                .map(item => typeof item === 'string' ? item : item?.id)
                .map(id => String(id || '').trim())
                .filter(Boolean)
                .filter(id => !knownIds.has(id));
            return [...new Set(missing)];
        }

        // 1. 初始化
        fetch('cards.json').then(res => res.json()).then(data => {
            allCards = data;
            myDeck = normalizeImportedDeck(myDeck);
            persistCurrentDeck();
            filterCards(); // 直接调用过滤器来触发第一次渲染
            renderDeck();
            
            // 启动无限滚动雷达
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    renderLibrary(currentFilteredCards, false); // 不重置，继续加载下一批
                }
            }, {
                root: document.getElementById('scrollContainer'),
                rootMargin: '300px' // 提前 300px 触发，做到丝滑无感加载
            });
            observer.observe(document.getElementById('sentinel'));
        });

        // 2. 分块渲染引擎 (isReset 决定是清空重画，还是往后追加)
        function renderLibrary(cards, isReset = true) {
            const grid = document.getElementById('cardGrid');
            const sentinel = document.getElementById('sentinel');
            
            if (isReset) {
                currentFilteredCards = cards;
                currentRenderedIndex = 0;
                grid.innerHTML = ''; // 清空桌面
            }

            // 切出下一弹夹的卡牌
            const nextBatch = currentFilteredCards.slice(currentRenderedIndex, currentRenderedIndex + CHUNK_SIZE);
            
            if (nextBatch.length === 0) {
                sentinel.innerText = t('END_OF_DATABANK');
                return; 
            } else {
                sentinel.innerText = t('SCANNING_DATABANK');
            }

            // 转化为 HTML 并直接追加到底部 (性能极高)
            const html = nextBatch.map(card => {
                const colors = getCardColors(card).join('/');
                const meta = [card.id, colors, card.level ? `Lv.${card.level}` : '', card.playCost !== undefined ? `Cost ${card.playCost}` : ''].filter(Boolean).join(' · ');
                return `
                <div class="card-item" onclick="openBuilderDetailById('${escapeHtml(card.id)}')" ondblclick="addToDeck('${escapeHtml(card.id)}')" onmouseenter="showBuilderDetailById('${escapeHtml(card.id)}')" onmouseleave="showBuilderDetail(null)">
                    <button class="library-add-btn" title="Add one copy" onclick="event.stopPropagation(); addToDeck('${escapeHtml(card.id)}')">+</button>
                    <img src="${escapeHtml(displayCardImage(card))}" loading="lazy" onerror="this.src='cardback.png'">
                    <div class="card-badge"><div class="card-badge-name">${escapeHtml(displayCardName(card) || card.id)}</div><div class="card-badge-meta">${escapeHtml(meta)}</div></div>
                </div>`;
            }).join('');

            grid.insertAdjacentHTML('beforeend', html);
            currentRenderedIndex += nextBatch.length;
        }

        // 3. 搜索和过滤
        function filterCards() {
            const query = document.getElementById('searchInput').value;
            const traitQuery = document.getElementById('traitInput').value;
            const lv = document.getElementById('levelFilter').value;
            const type = document.getElementById('typeFilter').value;

            const filtered = allCards.filter(c => {
                const matchSearch = matchesTextQuery(c, query);
                const matchTrait = matchesTraitKeywordQuery(c, traitQuery);
                const matchColor = matchesColor(c);
                const matchLv = !lv || String(c.level) === lv || (lv === '2' && isDigiEgg(c));
                const cardType = String(c.type || '').toLowerCase();
                const isDual = cardType.includes('dual');
                const matchType = !type || (type === 'egg' ? isDigiEgg(c) : (type === 'dual' ? isDual : (cardType.includes(type) || (isDual && (type === 'digimon' || type === 'option'))))); 
                return matchSearch && matchTrait && matchColor && matchLv && matchType;
            }).sort(compareCards);
            
            const meta = document.getElementById('result-meta');
            if (meta) meta.innerText = t('MATCHES', { count: filtered.length });
            renderLibrary(filtered, true);
        }

        function showBuilderDetailById(cardId) {
            showBuilderDetail(allCards.find(c => c.id === cardId));
        }

        function getTraitLine(card) {
            const rawTraits = Array.isArray(card?.traitTokens) && card.traitTokens.length
                ? card.traitTokens
                : String(card?.traits || '').split(/[\/,]/);
            return [...new Set(rawTraits
                .map(trait => String(trait || '').trim())
                .filter(Boolean))]
                .join(' / ');
        }

        function openBuilderDetailById(cardId) {
            const card = allCards.find(c => c.id === cardId) || myDeck.find(c => c.id === cardId);
            openBuilderDetail(card);
        }

        function openBuilderDetail(card) {
            const overlay = document.getElementById('builder-detail-overlay');
            if (!overlay || !card) return;
            builderDetailCard = card;
            const colors = getCardColors(card).join('/');
            const meta = [
                card.id,
                displayType(card),
                colors,
                card.level ? `Lv.${card.level}` : '',
                card.dp ? `DP ${card.dp}` : '',
                card.playCost !== undefined ? `Cost ${card.playCost}` : ''
            ].filter(Boolean).join(' · ');
            const traitLine = getTraitLine(card);
            const format = (value) => value ? escapeHtml(value).replace(/\n/g, '<br>') : '';
            const mainText = displayMainText(card) || displayEffectText(card);
            const sourceText = displaySourceText(card);
            document.getElementById('builder-detail-art').style.backgroundImage = `url('${displayCardImage(card).replace(/'/g, "%27")}')`;
            document.getElementById('builder-detail-name').innerText = displayCardName(card) || card.id || 'UNKNOWN';
            document.getElementById('builder-detail-meta').innerText = meta;
            document.getElementById('builder-detail-traits').innerText = traitLine;
            document.getElementById('builder-detail-main').innerHTML = mainText
                ? `<span class="builder-detail-label">${t('MAIN_LABEL')}</span>${format(mainText)}`
                : `<span class="builder-detail-label">${t('MAIN_LABEL')}</span><span style="color:#777">No main text.</span>`;
            document.getElementById('builder-detail-source').innerHTML = sourceText
                ? `<span class="builder-detail-label">${t('INHERITED_LABEL')}</span>${format(sourceText)}`
                : `<span class="builder-detail-label">${t('INHERITED_LABEL')}</span><span style="color:#777">No inherited/security text.</span>`;
            overlay.style.display = 'flex';
        }

        function closeBuilderDetail(event) {
            if (event) event.stopPropagation();
            const overlay = document.getElementById('builder-detail-overlay');
            if (overlay) overlay.style.display = 'none';
        }

        function addDetailCardToDeck() {
            if (!builderDetailCard) return;
            addToDeck(builderDetailCard.id);
            openBuilderDetailById(builderDetailCard.id);
        }

        function fillDetailCardToFour() {
            if (!builderDetailCard) return;
            addToFour(builderDetailCard.id);
            openBuilderDetailById(builderDetailCard.id);
        }

        function clearDetailCardCopies() {
            if (!builderDetailCard) return;
            removeAllCopies(builderDetailCard.id);
            openBuilderDetailById(builderDetailCard.id);
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeBuilderDetail(event);
        });

        function showCardDetail(card) {
        const panel = document.getElementById('hover-card-info');
        if (!card) { panel.style.display = 'none'; return; }
        
        panel.style.display = 'flex';
        document.getElementById('info-name').innerText = displayCardName(card);
        document.getElementById('info-type-level').innerText = displayType(card) + (card.level ? ` / LV.${card.level}` : '');
        document.getElementById('info-dp').innerText = card.dp ? `DP ${card.dp}` : '';
        
        const formatText = (txt) => txt ? txt.replace(/\n/g, '<br>') : '';
        const mainText = displayMainText(card) || displayEffectText(card);
        const sourceText = displaySourceText(card);
        document.getElementById('info-main-effect').innerHTML = mainText ? `<b>${t('MAIN_LABEL')}</b><br>${formatText(mainText)}` : '';
        document.getElementById('info-source-effect').innerHTML = sourceText ? `<b>${t('INHERITED_LABEL')}</b><br>${formatText(sourceText)}` : '';
    }

        // 📥 智能加卡逻辑：分别验证主卡组和蛋组的容量
        function addToDeck(cardId) {
            const card = allCards.find(c => c.id === cardId);
            if (!card) return;

            const isEgg = isDigiEgg(card);
            const { main, eggs } = splitDeck(myDeck);

            if (isEgg && eggs.length >= 5) return alert("⚠️ 蛋组已满，最多只能带 5 张数码蛋！");
            if (!isEgg && main.length >= 50) return alert("⚠️ 主卡组已满，最多只能带 50 张！");
            if (countCopies(cardId) >= 4) return alert("⚠️ 同编号卡牌最多只能带 4 张！");

            myDeck.push(cloneDeckCard(card));
            persistCurrentDeck();
            renderDeck();
            showBuilderToast(`+ ${displayCardName(card) || card.id}`);
        }

        // 📊 智能渲染逻辑：更新仪表盘，并为蛋卡加上紫色高光
        function renderDeck() {
            const list = document.getElementById('deckList');
            
            // 拆分与统计
            const eggs = myDeck.filter(c => c.level === 2 || (c.type && c.type.toLowerCase().includes('egg')));
            const main = myDeck.filter(c => !(c.level === 2 || (c.type && c.type.toLowerCase().includes('egg'))));
            
            let digimonCount = 0, optionCount = 0, tamerCount = 0;
            main.forEach(c => {
                const t = c.type ? c.type.toLowerCase() : '';
                if (t.includes('digimon')) digimonCount++;
                else if (t.includes('option')) optionCount++;
                else if (t.includes('tamer')) tamerCount++;
            });

            // 注入数据到仪表盘
            document.getElementById('main-count').innerText = main.length;
            document.getElementById('egg-count').innerText = eggs.length;
            document.getElementById('digimon-count').innerText = digimonCount;
            document.getElementById('option-count').innerText = optionCount;
            document.getElementById('tamer-count').innerText = tamerCount;

            // 炫酷交互：满了就变绿，提示玩家可以出战了
            document.getElementById('main-count').style.color = main.length === 50 ? 'var(--green)' : 'var(--blue)';
            document.getElementById('egg-count').style.color = (eggs.length > 0 && eggs.length <= 5) ? 'var(--green)' : 'var(--purple)';
            renderCurve(main);
            const deployBtn = document.querySelector('.btn-deploy');
            const validation = validateDeck(myDeck, false);
            const strictValidation = validateDeck(myDeck, true);
            const deckError = document.getElementById('deck-error');
            if (deckError) {
                deckError.className = strictValidation.ok ? 'valid' : 'invalid';
                deckError.innerText = strictValidation.ok ? 'READY: Main deck 50 / Digi-Egg OK / copy limit OK / Banned-Restricted OK.' : strictValidation.error;
            }
            if (deployBtn) {
                deployBtn.title = validation.ok ? 'Deck payload is valid and official B/R legal.' : validation.error;
                deployBtn.style.opacity = validation.ok ? '1' : '0.65';
            }

            renderDeckReadiness(myDeck);

            // Round 18L: grouped cockpit list. One row per card ID keeps large
            // decks readable while preserving the actual per-copy payload in myDeck.
            const groups = getDeckGroups(myDeck);
            const eggGroups = groups.filter(g => isDigiEgg(g.card));
            const mainGroups = groups.filter(g => !isDigiEgg(g.card));
            const renderGroup = (group) => {
                const card = group.card;
                const isEgg = isDigiEgg(card);
                const borderStyle = isEgg ? 'border-left: 3px solid var(--purple);' : 'border-left: 3px solid var(--blue);';
                const typeLabel = isEgg ? 'DIGI-EGG' : String(card.type || 'CARD').toUpperCase();
                const meta = [card.id, typeLabel, card.level ? `Lv.${card.level}` : '', card.playCost !== undefined ? `Cost ${card.playCost}` : ''].filter(Boolean).join(' · ');
                const over = group.count > 4;
                return `
                    <div class="deck-card grouped" style="${borderStyle}" onclick="openBuilderDetailById('${escapeHtml(card.id)}')" onmouseenter="showBuilderDetailById('${escapeHtml(card.id)}')" onmouseleave="showBuilderDetail(null)">
                        <img src="${escapeHtml(displayCardImage(card))}" onerror="this.src='cardback.png'">
                        <div class="deck-card-info">
                            <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(displayCardName(card) || card.id)}</div>
                            <div style="color:#666; font-family:monospace; font-size:10px">${escapeHtml(meta)}</div>
                            <div class="quick-count-btns">
                                <button class="mini-btn" onclick="event.stopPropagation(); addToDeck('${escapeHtml(card.id)}')">+1</button>
                                <button class="mini-btn" onclick="event.stopPropagation(); addToFour('${escapeHtml(card.id)}')">FILL 4</button>
                                <button class="mini-btn" onclick="event.stopPropagation(); removeAllCopies('${escapeHtml(card.id)}')">CLEAR</button>
                            </div>
                        </div>
                        <div class="deck-copy-badge ${over ? 'over' : ''}">×${group.count}</div>
                        <button class="remove-btn" title="Remove one copy" onclick="removeOneCopy('${escapeHtml(card.id)}')">−</button>
                    </div>
                `;
            };
            list.innerHTML = [
                eggGroups.length ? `<div class="deck-section-title">DIGI-EGG DECK // ${eggs.length}/5</div>${eggGroups.map(renderGroup).join('')}` : '',
                `<div class="deck-section-title">MAIN DECK // ${main.length}/50</div>${mainGroups.map(renderGroup).join('') || `<div style="color:#666; font-family:monospace; font-size:11px; text-align:center; padding:20px;">${t('EMPTY_MAIN_DECK')}</div>`}`
            ].join('');
        }

        function removeFromDeck(index) {
            myDeck.splice(index, 1);
            persistCurrentDeck();
            renderDeck();
        }


        function removeOneCopy(cardId) {
            if (window.event?.stopPropagation) window.event.stopPropagation();
            const idx = myDeck.findIndex(c => c.id === cardId);
            if (idx === -1) return;
            const [removed] = myDeck.splice(idx, 1);
            persistCurrentDeck();
            renderDeck();
            showBuilderToast(`− ${displayCardName(removed) || cardId}`);
        }

        // 🔥 判断身份：如果是 Discord 玩家，开启“存入仓库”模式
        // 这里我们需要先知道 currentUserId (可以通过 fetch /api/me 拿到)
        // 📡 网页加载时，探针自动验证 Discord 身份
        // 📡 防弹级 Discord 身份探针
        try {
            fetch('/api/me', { method: 'GET' })
            .then(res => {
                if (res.ok) return res.json();
                throw new Error('GUEST_MODE');
            })
            .then(user => {
                if (!user || !user.id) return;
                currentUserId = user.id;
                const vaultBtn = document.getElementById('vault-btn');
                if (vaultBtn) vaultBtn.style.display = 'block'; 
                console.log(`>> WELCOME COMMANDER: ${user.username}`);
            })
            .catch(err => {
                console.log(`>> IDENTITY UNVERIFIED: ${err.message}. ENTERING GUEST MODE.`);
                currentUserId = null;
            });
        } catch (e) {
            console.log(">> LOCAL ENVIRONMENT DETECTED. GUEST MODE ACTIVE.");
            currentUserId = null;
        }

        // 📂 打开云端编辑库
        function openBuilderVault() {
            if (!currentUserId) return;
            const vault = safeJsonParse(localStorage.getItem('dtcg_vault'), {});
            const myDecks = vault[currentUserId] || [];
            const list = document.getElementById('builder-vault-list');
            
            document.getElementById('builder-vault-overlay').style.display = 'flex';
            
            if (myDecks.length === 0) {
                list.innerHTML = `<div style="color:#666; text-align:center; font-family:monospace;">NO DATA FOUND IN VAULT.</div>`;
                return;
            }

            // 渲染列表并注入 EDIT 和 DEL 按钮
            list.innerHTML = myDecks.map((d, idx) => `
                <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 6px; border: 1px solid #333;">
                    <div style="text-align: left;">
                        <div style="color:var(--gold); font-weight:bold; font-size:14px;">${d.name}</div>
                        <div style="font-size:10px; color:#888; font-family:monospace; margin-top:4px;">${normalizeImportedDeck(d.cards || []).length} CARDS</div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button style="background:var(--blue); border:none; padding:6px 12px; cursor:pointer; font-weight:bold; font-size:10px; border-radius:4px; color:black;" onclick="loadDeckFromVault(${idx})">EDIT</button>
                        <button style="background:var(--red); color:white; border:none; padding:6px 12px; cursor:pointer; font-weight:bold; font-size:10px; border-radius:4px;" onclick="deleteDeckFromVault(${idx})">DEL</button>
                    </div>
                </div>
            `).join('');
        }

        // 📥 将卡组吸入编辑面板
        function loadDeckFromVault(idx) {
            const vault = safeJsonParse(localStorage.getItem('dtcg_vault'), {});
            const myDecks = vault[currentUserId] || [];
            if (!myDecks[idx]) return;
            myDeck = normalizeImportedDeck(myDecks[idx].cards || []);
            loadedDeckName = String(myDecks[idx].name || 'MY_NEW_DECK').slice(0, 48); // 锁定正在编辑的名字
            persistCurrentDeck();
            renderDeck();
            document.getElementById('builder-vault-overlay').style.display = 'none';
        }

        // 🗑️ 物理抹除卡组
        function deleteDeckFromVault(idx) {
            if(!confirm("⚠️ 警告：这会从你的云端永久删除这个卡组，确定吗？")) return;
            const vault = safeJsonParse(localStorage.getItem('dtcg_vault'), {});
            vault[currentUserId].splice(idx, 1);
            localStorage.setItem('dtcg_vault', JSON.stringify(vault));
            openBuilderVault(); // 刷新列表
        }

        // 🚀 终极版保存逻辑：支持“另存为”或“覆盖”
        function saveAndDeploy() {
            myDeck = normalizeImportedDeck(myDeck);
            const deckCheck = validateDeck(myDeck, true);
            if (!deckCheck.ok) return alert(`⚠️ ${deckCheck.error}`);

            if (currentUserId) {
                // 精英玩家模式：如果编辑过，默认带上原名
                let deckName = prompt("确认出战代号 (用新名字将另存为新卡组，原名则直接覆盖):", loadedDeckName);
                deckName = String(deckName || '').trim().slice(0, 48);
                if (!deckName) return;

                const vault = safeJsonParse(localStorage.getItem('dtcg_vault'), {});
                if (!vault[currentUserId]) vault[currentUserId] = [];
                
                // 查找是否同名，同名就覆盖，不同名就新增
                const existingIdx = vault[currentUserId].findIndex(d => d.name === deckName);
                if (existingIdx !== -1) {
                    vault[currentUserId][existingIdx].cards = normalizeImportedDeck(myDeck); // 覆盖更新
                } else {
                    vault[currentUserId].push({ name: deckName, cards: normalizeImportedDeck(myDeck), updatedAt: Date.now() }); // 新增
                }
                
                localStorage.setItem('dtcg_vault', JSON.stringify(vault));
            }
            
            // 将正在编辑的卡组压入热启动内存，并弹射回大厅
            persistCurrentDeck();
            window.location.href = 'index.html';
        }

        // 📤 导出功能：Round 11J compact JSON，仍兼容旧逗号 ID 导入
        function exportDeck() {
            if (myDeck.length === 0) return;
            const { main, eggs } = splitDeck(myDeck);
            const exportData = JSON.stringify({
                format: 'DTCG_DECK_V2',
                name: loadedDeckName || 'EXPORTED_DECK',
                main: main.map(c => c.id),
                eggs: eggs.map(c => c.id)
            });
            navigator.clipboard.writeText(exportData).then(() => {
                alert("卡组代码已复制到剪贴板！\n支持主卡组/蛋组分离，IMPORT 可直接粘贴。官方赛事流程不使用 side deck。");
            }).catch(() => {
                prompt("复制失败，请手动复制这段代码：", exportData);
            });
        }

        // 📥 导入功能：支持 DTCG_DECK_V2 JSON / 旧版逗号 ID / 纯 ID 数组
        function importDeck() {
            const code = prompt("请粘贴卡组代码（DTCG_DECK_V2 JSON 或逗号分隔 ID）:");
            if (!code) return;
            let parsed = null;
            try { parsed = JSON.parse(code); }
            catch (e) { parsed = code.split(/[\s,]+/).map(id => id.trim()).filter(Boolean); }
            const rawItems = Array.isArray(parsed) ? parsed : (parsed?.cards || [...(parsed?.main || []), ...(parsed?.eggs || parsed?.eggDeck || [])]);
            const imported = normalizeImportedDeck(parsed);
            const missing = importErrorReport(rawItems || [], imported);
            const check = validateDeck(imported, false);
            if (!check.ok) return alert(`⚠️ 导入失败：${check.error}`);
            if (missing.length > 0) {
                const proceed = confirm(`⚠️ 有 ${missing.length} 个 ID 没有在 cards.json 找到，将以 unknown placeholder 导入：
${missing.slice(0, 20).join(', ')}${missing.length > 20 ? '...' : ''}

仍然继续吗？`);
                if (!proceed) return;
            }
            myDeck = imported;
            if (parsed && typeof parsed === 'object' && parsed.name) loadedDeckName = String(parsed.name).slice(0, 48);
            persistCurrentDeck();
            renderDeck();
            alert(`✅ 导入成功：主卡组 ${check.mainCount} / 蛋组 ${check.eggCount}${missing.length ? ` / unknown ${missing.length}` : ''}`);
        }

        // 📡 组卡器专属：提取卡牌资料并展示
        function showBuilderDetail(card) {
            const panel = document.getElementById('hover-card-info');
            if (!card) { panel.style.display = 'none'; return; }
        
            panel.style.display = 'flex';
            document.getElementById('info-name').innerText = displayCardName(card) || 'UNKNOWN';
            document.getElementById('info-type-level').innerText = displayType(card) + (card.level ? ` / LV.${card.level}` : '') + (card.dp ? ` / DP ${card.dp}` : '');
        
            const traitLine = getTraitLine(card);
            document.getElementById('info-dp').innerText = traitLine;
            const format = (t) => t ? escapeHtml(t).replace(/\n/g, '<br>') : '';
            const mainText = displayMainText(card) || displayEffectText(card);
            const sourceText = displaySourceText(card);
            document.getElementById('info-main-effect').innerHTML = mainText ? `<b>${t('MAIN_LABEL')}</b><br>${format(mainText)}` : '';
            document.getElementById('info-source-effect').innerHTML = sourceText ? `<b>${t('INHERITED_LABEL')}</b><br>${format(sourceText)}` : '';
        }
    </script>
</body>
</html>
